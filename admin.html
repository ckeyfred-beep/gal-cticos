<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#121212">
    <title>Panel de Administración | URBAN</title>
    <link rel="stylesheet" href="admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- LOGIN -->
    <div id="login-screen" class="login-wrapper">
        <div class="login-box">
            <h2>Acceso Privado</h2>
            <p>Ingresa la contraseña para administrar la tienda</p>
            <input type="password" id="password-input" placeholder="Contraseña (ej. prueba)" autocomplete="off">
            <button onclick="checkPassword()">ENTRAR</button>
            <p id="error-msg" class="error"></p>
        </div>
    </div>

    <!-- PANTALLA 1: DASHBOARD -->
    <div id="screen-dashboard" class="app-screen" style="display: none;">
        <header class="admin-header">
            <div class="logo">URBAN<span style="color:var(--accent-color)">.</span>ADMIN</div>
            <button class="btn-logout" onclick="logout()">Salir</button>
        </header>

        <main class="admin-main">
            <h2 class="section-title">INFORMACIÓN</h2>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Total Ropa</h3>
                    <p id="stat-total">0</p>
                </div>
                <div class="stat-card">
                    <h3>Hombre</h3>
                    <p id="stat-hombre">0</p>
                </div>
                <div class="stat-card">
                    <h3>Mujer</h3>
                    <p id="stat-mujer">0</p>
                </div>
            </div>

            <button class="btn-go-upload" onclick="showScreen('upload')">
                + SUBIR PRODUCTO
            </button>

            <h2 class="section-title" style="margin-top: 2rem;">CATÁLOGO ACTUAL</h2>
            <div id="dashboard-catalog">
                <!-- JS inyecta las categorías aquí -->
            </div>
        </main>
    </div>

    <!-- PANTALLA 2: SUBIR PRODUCTO -->
    <div id="screen-upload" class="app-screen" style="display: none;">
        <header class="admin-header">
            <button class="btn-back" onclick="showScreen('dashboard')">← Volver</button>
            <div class="logo" style="font-size: 1rem;">SUBIR PRENDA</div>
            <div style="width: 60px;"></div>
        </header>

        <main class="admin-main">
            <form id="product-form" onsubmit="addProduct(event)" class="upload-form-layout">
                
                <div class="big-image-box" onclick="document.getElementById('prod-img').click()">
                    <div id="upload-text-container">
                        <label>SUBIR IMG</label>
                        <p style="color: #fff;">Toca aquí para abrir la galería</p>
                        <p class="tip">Sube una foto desde tu teléfono.</p>
                    </div>
                    <img id="img-preview" src="" style="display: none; width: 100%; height: 100%; object-fit: cover; border-radius: 8px;" alt="Previsualización">
                    
                    <input type="file" id="prod-img" accept="image/*" required style="display: none;" onchange="previewImage(event)">
                </div>

                <div class="form-grid-row">
                    <input type="text" id="prod-name" placeholder="NOMBRE" required>
                    <input type="number" id="prod-price" placeholder="PRECIO" step="0.01" required>
                </div>

                <div class="custom-category-selector">
                    <input type="radio" id="cat-hombre" name="categoria" value="hombre" required>
                    <label for="cat-hombre">HOMBRE</label>

                    <input type="radio" id="cat-mujer" name="categoria" value="mujer">
                    <label for="cat-mujer">MUJER</label>

                    <input type="radio" id="cat-accesorios" name="categoria" value="accesorios">
                    <label for="cat-accesorios">ACCESORIOS</label>
                </div>

                <input type="text" id="prod-info" placeholder="INFORMACIÓN EXTRA (Opcional)" class="full-width-input">

                <button type="submit" class="btn-submit-big">SUBIR</button>
            </form>
        </main>
    </div>

    <!-- MODAL PARA EDITAR -->
    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeEditModal()">&times;</span>
            <h2>EDITAR PRENDA</h2>
            <form id="edit-form" onsubmit="saveEdit(event)">
                <input type="hidden" id="edit-id">
                <div class="input-group">
                    <label>Nombre</label>
                    <input type="text" id="edit-name" required>
                </div>
                <div class="input-group">
                    <label>Precio ($)</label>
                    <input type="number" id="edit-price" step="0.01" required>
                </div>
                
                <div class="input-group">
                    <label>Categoría</label>
                    <div class="custom-category-selector" style="margin-top: 0;">
                        <input type="radio" id="edit-cat-hombre" name="edit-categoria" value="hombre" required>
                        <label for="edit-cat-hombre">HOMBRE</label>
                        <input type="radio" id="edit-cat-mujer" name="edit-categoria" value="mujer">
                        <label for="edit-cat-mujer">MUJER</label>
                        <input type="radio" id="edit-cat-accesorios" name="edit-categoria" value="accesorios">
                        <label for="edit-cat-accesorios">ACCESORIOS</label>
                    </div>
                </div>

                <button type="submit" class="btn-save">GUARDAR CAMBIOS</button>
                <button type="button" class="btn-delete-modal" onclick="openDeleteModal()">ELIMINAR PRENDA</button>
            </form>
        </div>
    </div>

    <!-- MODAL DE CONFIRMACIÓN DE BORRADO -->
    <div id="delete-modal" class="modal" style="z-index: 1001;">
        <div class="modal-content" style="text-align: center;">
            <h2>¿ELIMINAR PRENDA?</h2>
            <p style="color: #888; margin-bottom: 1.5rem;">Esta acción no se puede deshacer.</p>
            <button class="btn-delete-modal" onclick="confirmDelete()" style="margin-bottom: 1rem; background: var(--accent-color); color: white;">SÍ, ELIMINAR</button>
            <button type="button" class="btn-save" onclick="closeDeleteModal()" style="background: #333;">CANCELAR</button>
        </div>
    </div>

    <!-- CONEXIÓN A FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC4sjHQ6jQ5pTzO1Oo1BKc65Bmd8JcLFeU",
            authDomain: "hola-a2613.firebaseapp.com",
            projectId: "hola-a2613",
            storageBucket: "hola-a2613.firebasestorage.app",
            messagingSenderId: "461736119740",
            appId: "1:461736119740:web:b9e06504a8d2595c546fb9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.db = db;
        window.dbFunctions = { collection, addDoc, getDocs, deleteDoc, doc, updateDoc };
        
        window.dispatchEvent(new Event('firebaseReady'));
    </script>
    
    <script src="admin.js"></script>
</body>
</html>
